name: Build pocket-esp-ai firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          python scripts/release.py pocket-wall-e-c3 --name pocket-esp-ai-txfix

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pocket-esp-ai-txfix
          path: build/merged-binary.bin
